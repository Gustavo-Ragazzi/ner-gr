version: "3.9"

services:
  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    networks:
      - ner-network

  adk:
    build:
      context: ./adk
    volumes:
      - ./adk:/app
    depends_on:
      - api
    networks:
      - ner-network

networks:
  ner-network:
